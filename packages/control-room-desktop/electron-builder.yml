# 打包配置：产出免安装便携版与安装包，两者都带系统托盘。
appId: com.agentrelay.controlroom
productName: 协作控制中心
copyright: Apache-2.0
# electron 提升安装在工作区根目录，显式声明版本，打包器才不会找不到它。
electronVersion: 33.4.11
directories:
  output: release
  buildResources: assets

# 运行期只需要托盘外壳、服务端打包产物与图标；服务端依赖已内联进 dist/server.mjs。
files:
  - main.cjs
  - lib/**/*
  - dist/**/*
  - assets/icon.png
  - assets/tray.png
  - package.json
  - '!**/*.map'

# 没有原生产物，跳过重建可显著缩短打包时间。
npmRebuild: false
buildDependenciesFromSource: false
asar: true

win:
  icon: assets/icon.ico
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]

portable:
  artifactName: RelayControlRoom-${version}-便携版.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 协作控制中心
  artifactName: RelayControlRoom-${version}-安装包.${ext}
