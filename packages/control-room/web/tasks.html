<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b12" />
    <meta name="description" content="Relay 任务工作台 — 派发异步任务、跟踪阶段链与回传。" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tasks.css" />
    <title>任务工作台 · Relay</title>
  </head>
  <body data-view="overview">
    <div class="task-topbar">
      <a class="task-brand" href="./">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M20 3 34 11v18l-14 8L6 29V11L20 3Z" />
            <path d="m20 10 8 5v10l-8 5-8-5V15l8-5Z" />
            <circle cx="20" cy="20" r="2.5" />
            <path d="M20 3v7m14 1-6 4m6 14-6-4M20 37v-7M6 29l6-4M6 11l6 4" />
          </svg>
        </span>
        <span>任务工作台<small>异步派发 · 回传 · 阶段链</small></span>
      </a>
      <div class="task-crumbs">
        <span class="crumb-code">任务协议 / 02</span>
        <span>异步协作<span>/</span><strong id="crumb-current">概览</strong></span>
      </div>
      <div class="task-chips">
        <span class="chip" id="engine-chip" data-state="unknown" title="任务引擎状态">
          <span data-icon="activity"></span><span id="engine-chip-text">正在读取引擎…</span>
        </span>
        <span class="chip mono" id="data-root-chip" title="任务数据目录">—</span>
        <button class="icon-button" id="refresh-button" type="button" aria-label="刷新" title="刷新">
          <span data-icon="scan"></span>
        </button>
        <a class="icon-button" href="./chat.html" aria-label="群聊" title="群聊">
          <span data-icon="messages-square"></span>
        </a>
        <a class="icon-button" href="./" aria-label="返回观察台" title="返回观察台">
          <span data-icon="orbit"></span>
        </a>
      </div>
    </div>

    <div class="banner" id="banner" hidden>
      <span data-icon="triangle-alert"></span><span id="banner-text"></span>
    </div>

    <div class="task-shell">
      <aside class="rail" aria-label="任务导航">
        <nav class="rail-nav">
          <button type="button" data-nav="overview" class="rail-button active">
            <span data-icon="orbit"></span>概览<small id="nav-count-tasks">0</small>
          </button>
          <button type="button" data-nav="dispatch" class="rail-button">
            <span data-icon="plus"></span>派发任务
          </button>
          <button type="button" data-nav="clients" class="rail-button">
            <span data-icon="cpu"></span>客户端接入
          </button>
          <button type="button" data-nav="settings" class="rail-button">
            <span data-icon="shield-check"></span>设置与数据
          </button>
        </nav>
        <div class="rail-label"><span>主题</span><span class="mono" id="topic-total">0</span></div>
        <div id="topic-list" class="topic-list"></div>
        <p class="rail-note">
          派发只返回受理回执，不等待模型完成。回传到达后由原聊天继续，期间没有查收循环。
        </p>
      </aside>
      <main class="task-main" id="main" aria-live="polite"></main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="./icons.js"></script>
    <script src="./tasks.js"></script>
  </body>
</html>
